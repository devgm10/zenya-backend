name: pipeline

on:
    pull_request:
        branches: [master, develop]

jobs:
    ci:
        name: Continuous integration
        runs-on: ubuntu-latest
        environment: staging

        steps:
            -   name: Checkout repo
                uses: actions/checkout@v3

            -   name: Set up Python
                uses: actions/setup-python@v4
                with:
                    python-version: '3.12'

            -   name: Cache pip dependencias
                uses: actions/cache@v3
                with:
                    path: ~/.cache/pip
                    key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                    restore-keys: |
                        ${{ runner.os }}-pip-

            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt

            -   name: Start PostgreSQL container
                run: |
                    docker run -d \
                        --name postgres \
                        -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
                        -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
                        -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
                        -p 5432:5432 \
                        postgres:15
                    
                    echo "Waiting for PostgreSQL to be ready..."
                    timeout=30
                    until docker exec postgres pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} > /dev/null 2>&1 || [ $timeout -eq 0 ]; do
                        sleep 2
                        timeout=$((timeout - 2))
                    done
                    
                    if [ $timeout -eq 0 ]; then
                        echo "PostgreSQL failed to start"
                        exit 1
                    fi
                    echo "PostgreSQL is ready!"

            -   name: Run database migrations
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                    POSTGRES_HOST: localhost
                    POSTGRES_PORT: 5432
                    DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
                run: python manage.py migrate

            -   name: Run tests
                env:
                    POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                    POSTGRES_HOST: localhost
                    POSTGRES_PORT: 5432
                    DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
                run: python manage.py test

            -   name: Build Docker image
                run: |
                    docker build \
                        -t ${{ secrets.DOCKERHUB_USERNAME }}/zenya-backend:latest \
                        -t ${{ secrets.DOCKERHUB_USERNAME }}/zenya-backend:${{ github.sha }} \
                        .

            -   name: Login to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Push to Docker Hub
                run: |
                    docker push ${{ secrets.DOCKERHUB_USERNAME }}/zenya-backend:latest
                    docker push ${{ secrets.DOCKERHUB_USERNAME }}/zenya-backend:${{ github.sha }}

            -   name: Cleanup PostgreSQL container
                if: always()
                run: |
                    docker stop postgres || true
                    docker rm postgres || true